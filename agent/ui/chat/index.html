<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogSight — Trader Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    background: #1a1d27;
    border-bottom: 1px solid #2d3148;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 { font-size: 18px; font-weight: 600; color: #7c93f5; }
  header span { font-size: 13px; color: #64748b; }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .bubble {
    max-width: 720px;
    border-radius: 12px;
    padding: 14px 18px;
    line-height: 1.6;
    font-size: 14px;
  }

  .bubble.user {
    background: #2d3a6e;
    align-self: flex-end;
    color: #c7d3ff;
  }

  .bubble.assistant {
    background: #1e2130;
    border: 1px solid #2d3148;
    align-self: flex-start;
  }

  .bubble.assistant .answer { margin-bottom: 10px; white-space: pre-wrap; }

  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    border-top: 1px solid #2d3148;
    padding-top: 8px;
  }

  .source-chip {
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: #64748b;
  }

  .source-chip .machine { color: #7c93f5; }

  .bubble.loading {
    color: #64748b;
    font-style: italic;
  }

  #input-bar {
    padding: 16px 24px;
    background: #1a1d27;
    border-top: 1px solid #2d3148;
    display: flex;
    gap: 12px;
  }

  #question {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2d3148;
    border-radius: 8px;
    padding: 10px 14px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    resize: none;
    height: 42px;
    line-height: 1.4;
  }

  #question:focus { border-color: #7c93f5; }

  #send-btn {
    background: #7c93f5;
    color: #0f1117;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  #send-btn:hover { background: #93a8ff; }
  #send-btn:disabled { background: #2d3148; color: #64748b; cursor: default; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #64748b;
  }

  .empty-state h2 { font-size: 20px; color: #7c93f5; }
  .empty-state p { font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>LogSight</h1>
  <span>Distributed Log Intelligence</span>
</header>

<div id="chat-container">
  <div class="empty-state" id="empty">
    <h2>Ask about your logs</h2>
    <p>e.g. "Is curve building complete?" · "Any errors on server1 in the last hour?" · "Did the risk engine start?"</p>
  </div>
</div>

<div id="input-bar">
  <textarea id="question" placeholder="Ask a question about your systems…" rows="1"></textarea>
  <button id="send-btn">Ask</button>
</div>

<script>
  const chatEl = document.getElementById('chat-container');
  const emptyEl = document.getElementById('empty');
  const questionEl = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');

  function addBubble(cls, html) {
    if (emptyEl) emptyEl.remove();
    const div = document.createElement('div');
    div.className = `bubble ${cls}`;
    div.innerHTML = html;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  async function sendQuestion() {
    const question = questionEl.value.trim();
    if (!question) return;

    questionEl.value = '';
    sendBtn.disabled = true;

    addBubble('user', escHtml(question));
    const loadingBubble = addBubble('loading', 'Searching logs…');

    try {
      const res = await fetch('/v1/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      const data = await res.json();
      loadingBubble.remove();

      if (!res.ok) {
        addBubble('assistant', `<div class="answer">Error: ${escHtml(data.detail || 'Unknown error')}</div>`);
        return;
      }

      let sourcesHtml = '';
      if (data.sources && data.sources.length) {
        const chips = data.sources.map(s =>
          `<span class="source-chip"><span class="machine">${escHtml(s.machine)}</span> · ${escHtml(s.process)} · ${s.lines_matched} lines</span>`
        ).join('');
        sourcesHtml = `<div class="sources">${chips}</div>`;
      }

      addBubble('assistant', `<div class="answer">${escHtml(data.answer)}</div>${sourcesHtml}`);
    } catch (e) {
      loadingBubble.remove();
      addBubble('assistant', `<div class="answer">Network error: ${escHtml(e.message)}</div>`);
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  questionEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
